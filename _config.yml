# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 刘志宁博客
subtitle: 
description: '分享学习经验和IT技术，记录个人成长'
keywords: 刘志宁博客
author: 刘志宁
language: zh-CN
timezone: Asia/Shanghai

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://liuzhining.com
permalink: posts/:abbrlink/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
  博客日志: blog-diary
  AI工具: ai-tools
tag_map:
  ChatGPT: chatgpt

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
## Butterfly: https://github.com/jerryc127/hexo-theme-butterfly
theme: butterfly

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: git@github.com:liuzhining/liuzhining.github.io.git
  branch: main

# hexo-abbrlink 插件1：自动生成短链接
## https://github.com/ohroy/hexo-abbrlink
abbrlink:
  alg: crc32   # 算法：crc16 或 crc32。crc32会默认生成8位十六进制 (如 3eeb1234)
  rep: hex     # 进制：hex (十六进制) 或 dec (十进制)。hex 更短

# hexo-filter-nofollow 插件2：自动为所有外部链接添加nofollow
## https://github.com/hexojs/hexo-filter-nofollow
nofollow:
  enable: true
  field: site    # post 或 site。post为仅文章，site为整个网站
  exclude:       # 需排除的域名。子域名需要指定，如 exclude1.com 不包含 www.exclude1.com 和 en.exclude1.com
    - ''
    - ''
